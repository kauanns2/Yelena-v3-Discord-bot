[project]
name = "yelena-v3"
version = "3.0.0-dev"
description = "Yelena V3 — Plataforma modular de IA"
requires-python = ">=3.11"
# Espelho das deps de produção. Render usa requirements.txt.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
yelena = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
